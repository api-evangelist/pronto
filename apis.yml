aid: pronto
name: Pronto
description: 'Pronto is an on-demand and subscription-based house-help marketplace
  operating across 11 Indian cities (including Mumbai, Bangalore, Delhi, Hyderabad,
  and Pune). It connects urban homes with trained, background-verified Pronto Professionals
  for everyday household chores such as cleaning, laundry, kitchen prep, bathroom care,
  ironing, dusting, and window cleaning. Customers book in the Pronto mobile app (iOS
  and Android) for instant (a Pro in ~15 minutes), scheduled, or recurring service,
  and pay in-app; the withpronto.com website is the marketing surface while the booking
  flow runs in the app. Pronto is backed by Bain Capital Ventures and General Catalyst.
  No public developer API, SDK, or developer portal is currently published; the only
  machine-readable surface is a provider-published llms.txt.'
